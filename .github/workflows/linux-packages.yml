name: linux-packages
# Reusable workflow: builds an app's Linux packages. For every target of
# targets.json and both architectures it builds inside the distro's official
# container image, makes the .deb or .rpm, runs the smoke test in a fresh
# container of the same image, and uploads the result as an artifact. One
# target per architecture also makes the tarball. With `release-tag`, all of
# it is attached to that GitHub Release of the calling repository.
#
# How to call it, and what the app has to bring: docs/linux-packages.md.
#
# Runners: the jobs run in the calling repository, and its owner decides.
# For Open-Breach they are Depot's, under the labels its other repositories
# use; for any other owner GitHub's own, so a fork of an app never waits for
# a runner it does not have. The calling repository's variables
# RUNNER_LINUX_X64 and RUNNER_LINUX_ARM64 name other labels, and so do the
# inputs `runner-x64` and `runner-arm64` for one call.
on:
  workflow_call:
    inputs:
      app:
        description: "Package name, such as rick. Also the first part of the tarball's name."
        type: string
        required: true
      binary:
        description: "The executable the package puts on the PATH; the smoke test runs it with --version. Default: app."
        type: string
        default: ""
      version:
        description: "X.Y.Z, or X.Y.Z-rc1 for a pre-release: the tag without its leading v."
        type: string
        required: true
      description:
        description: "One-line package description. Needed for build: prebuilt; a cargo build takes it from Cargo.toml."
        type: string
        default: ""
      desktop-file:
        description: "Path of the desktop entry, if the app has one."
        type: string
        default: ""
      icon:
        description: "Path of the icon, if the app has one: an .svg file, a square .png file, or a hicolor directory."
        type: string
        default: ""
      runtime-deps:
        description: 'Runtime dependencies per distro, as JSON: {"debian": ["libfoo1"], "ubuntu-24.04": ["libfoo1t64"], "fedora": ["foo-libs"]}. A key is a distro or one target id.'
        type: string
        default: "{}"
      build:
        description: "cargo (build from source in each container) or prebuilt (wrap the folder of an uploaded artifact)."
        type: string
        default: cargo
      artifact:
        description: "build: prebuilt only. Name of the artifact of this run that holds the prebuilt folder."
        type: string
        default: ""
      exclude:
        description: "Target ids to leave out, separated by spaces or commas, such as debian-12."
        type: string
        default: ""
      release-tag:
        description: "Tag of the GitHub Release to attach the files to. Empty: artifacts only."
        type: string
        default: ""
      build-deps:
        description: "build: cargo only. Distro packages the build needs, per distro, as JSON in the shape of runtime-deps."
        type: string
        default: "{}"
      build-command:
        description: "build: cargo only. The command that builds the app, run with bash in working-directory."
        type: string
        default: cargo build --release --locked
      build-artifact:
        description: "build: cargo only. Name of an artifact of the same run that the build needs: files an earlier job of the caller made, such as generated licence lists. Downloaded before build-command."
        type: string
        default: ""
      build-artifact-path:
        description: "build: cargo only. Where build-artifact is put, relative to working-directory. Default: working-directory itself."
        type: string
        default: "."
      cargo-package:
        description: "build: cargo only. The crate that carries the packaging metadata, in a workspace. Default: app."
        type: string
        default: ""
      bundle-dir:
        description: "build: cargo only. A folder the build lays out, with the binary at its top level and what belongs beside it; the tarball is made from it. Default: the binary alone."
        type: string
        default: ""
      working-directory:
        description: "Directory of the app in the calling repository; the other paths are relative to it."
        type: string
        default: "."
      maintainer:
        description: "build: prebuilt only. The package's maintainer field. Default: the owner of the calling repository."
        type: string
        default: ""
      runner-x64:
        description: "Runner label for the x86-64 jobs, and for the jobs that plan and attach. Default: the calling repository's variable RUNNER_LINUX_X64; without it Depot's label for Open-Breach, GitHub's for any other owner."
        type: string
        default: ${{ vars.RUNNER_LINUX_X64 || (github.repository_owner == 'Open-Breach' && 'depot-ubuntu-24.04-8' || 'ubuntu-24.04') }}
      runner-arm64:
        description: "Runner label for the arm64 jobs. Default: the calling repository's variable RUNNER_LINUX_ARM64; without it Depot's label for Open-Breach, GitHub's for any other owner."
        type: string
        default: ${{ vars.RUNNER_LINUX_ARM64 || (github.repository_owner == 'Open-Breach' && 'depot-ubuntu-24.04-arm-16' || 'ubuntu-24.04-arm') }}

# No `permissions` at the top: a called workflow can only narrow what the
# calling job grants, and asking for more than that fails the whole call. The
# jobs that build and test narrow themselves to reading; the job that attaches
# to the release uses what the caller granted, which has to include
# `contents: write` when `release-tag` is set.

jobs:
  plan:
    name: plan
    runs-on: ${{ inputs.runner-x64 }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      binary: ${{ steps.plan.outputs.binary }}
      package-version: ${{ steps.plan.outputs.package-version }}
    steps:
      # The scripts and targets.json come from the commit of this workflow
      # file, not from the calling repository and not from a branch name.
      - name: this workflow's source
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_repository and job.workflow_sha are empty: this runner is too old to tell a reusable workflow where it comes from"
            exit 1
          fi
          echo "linux-packages.yml of $WORKFLOW_REPOSITORY at $WORKFLOW_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .trebuchet
          persist-credentials: false
      - name: plan
        id: plan
        env:
          TREBUCHET_APP: ${{ inputs.app }}
          TREBUCHET_BINARY: ${{ inputs.binary }}
          TREBUCHET_VERSION: ${{ inputs.version }}
          TREBUCHET_DESCRIPTION: ${{ inputs.description }}
          TREBUCHET_BUILD: ${{ inputs.build }}
          TREBUCHET_ARTIFACT: ${{ inputs.artifact }}
          TREBUCHET_BUILD_ARTIFACT: ${{ inputs.build-artifact }}
          TREBUCHET_BUILD_ARTIFACT_PATH: ${{ inputs.build-artifact-path }}
          TREBUCHET_EXCLUDE: ${{ inputs.exclude }}
          TREBUCHET_RUNTIME_DEPS: ${{ inputs.runtime-deps }}
          TREBUCHET_BUILD_DEPS: ${{ inputs.build-deps }}
          TREBUCHET_RUNNER_X64: ${{ inputs.runner-x64 }}
          TREBUCHET_RUNNER_ARM64: ${{ inputs.runner-arm64 }}
        run: |
          .trebuchet/.github/scripts/linux-packages/plan.sh

  build:
    name: build ${{ matrix.target }} ${{ matrix.arch }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TREBUCHET_APP: ${{ inputs.app }}
      TREBUCHET_BINARY: ${{ needs.plan.outputs.binary }}
      TREBUCHET_VERSION: ${{ inputs.version }}
      TREBUCHET_PACKAGE_VERSION: ${{ needs.plan.outputs.package-version }}
      TREBUCHET_BUILD: ${{ inputs.build }}
      TREBUCHET_TARGET: ${{ matrix.target }}
      TREBUCHET_FORMAT: ${{ matrix.format }}
      TREBUCHET_ARCH: ${{ matrix.arch }}
      TREBUCHET_PKGARCH: ${{ matrix.pkgarch }}
      TREBUCHET_TARARCH: ${{ matrix.tararch }}
    steps:
      # git before the checkouts, so that they are clones with their history
      # and not archive downloads; curl and jq for the scripts. The paths are
      # set from inside the container: the `github.workspace` and
      # `runner.temp` contexts name the host's directories, not the
      # container's.
      - name: git, curl and jq
        run: |
          if [ "$TREBUCHET_FORMAT" = deb ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git jq xz-utils
          else
            dnf -y install ca-certificates curl git-core jq tar gzip xz findutils
          fi
          {
            echo "SCRIPTS=$RUNNER_TEMP/trebuchet/.github/scripts/linux-packages"
            echo "TREBUCHET_DIST=$RUNNER_TEMP/trebuchet-dist"
            echo "TREBUCHET_PREBUILT=$RUNNER_TEMP/trebuchet-prebuilt"
          } >> "$GITHUB_ENV"
      # This workflow's scripts, moved out of the workspace so that the app
      # is built from a checkout with nothing else in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .trebuchet
          persist-credentials: false
      - name: scripts
        run: |
          rm -rf "$RUNNER_TEMP/trebuchet"
          cp -R .trebuchet "$RUNNER_TEMP/trebuchet"
          rm -rf .trebuchet
      # The app, with its whole history: build scripts read it for version
      # and credit lines.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: prebuilt folder
        if: inputs.build == 'prebuilt'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ env.TREBUCHET_PREBUILT }}
      # An artifact does not keep file modes. A folder uploaded as one tar
      # file does; unpacked here. Either way the binary is made executable.
      - name: prebuilt folder, unpacked
        if: inputs.build == 'prebuilt'
        run: |
          cd "$TREBUCHET_PREBUILT"
          shopt -s nullglob dotglob
          entries=(*)
          if [ "${#entries[@]}" -eq 1 ] && [ -f "${entries[0]}" ]; then
            case "${entries[0]}" in
              *.tar | *.tar.gz | *.tar.xz)
                tar --extract --file "${entries[0]}" --no-same-owner
                rm "${entries[0]}"
                entries=(*)
                # A tar of the folder itself, rather than of what is in it.
                if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ] && [ ! -e "$TREBUCHET_BINARY" ]; then
                  mv "${entries[0]}" "$RUNNER_TEMP/trebuchet-prebuilt-inner"
                  mv "$RUNNER_TEMP/trebuchet-prebuilt-inner"/* .
                  rmdir "$RUNNER_TEMP/trebuchet-prebuilt-inner"
                fi
                ;;
            esac
          fi
          if [ ! -f "$TREBUCHET_BINARY" ]; then
            echo "::error::the prebuilt folder has no $TREBUCHET_BINARY at its top level"
            ls -la
            exit 1
          fi
          chmod 755 "$TREBUCHET_BINARY"
      - name: toolchain and tools
        working-directory: ${{ inputs.working-directory }}
        env:
          TREBUCHET_BUILD_DEPS: ${{ matrix.build_deps }}
        run: |
          "$SCRIPTS/prepare.sh"
      # Files an earlier job of the caller made, put where its build command
      # looks for them. The action takes a relative path from the workspace,
      # where the app was checked out. An artifact does not keep file modes.
      - name: build artifact
        if: inputs.build == 'cargo' && inputs.build-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.build-artifact }}
          path: ${{ format('{0}/{1}', inputs.working-directory, inputs.build-artifact-path) }}
      - name: build
        if: inputs.build == 'cargo'
        working-directory: ${{ inputs.working-directory }}
        env:
          TREBUCHET_BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          bash -euo pipefail -c "$TREBUCHET_BUILD_COMMAND"
      - name: package
        working-directory: ${{ inputs.working-directory }}
        env:
          TREBUCHET_RUNTIME_DEPS: ${{ matrix.runtime_deps }}
          TREBUCHET_CARGO_PACKAGE: ${{ inputs.cargo-package }}
          TREBUCHET_BUNDLE_DIR: ${{ inputs.build == 'prebuilt' && env.TREBUCHET_PREBUILT || inputs.bundle-dir }}
          TREBUCHET_DESCRIPTION: ${{ inputs.description }}
          TREBUCHET_MAINTAINER: ${{ inputs.maintainer || github.repository_owner }}
          TREBUCHET_DESKTOP_FILE: ${{ inputs.desktop-file }}
          TREBUCHET_ICON: ${{ inputs.icon }}
        run: |
          "$SCRIPTS/package.sh"
      - name: tarball
        if: matrix.tarball
        working-directory: ${{ inputs.working-directory }}
        env:
          TREBUCHET_BUNDLE_DIR: ${{ inputs.build == 'prebuilt' && env.TREBUCHET_PREBUILT || inputs.bundle-dir }}
          TREBUCHET_DESKTOP_FILE: ${{ inputs.desktop-file }}
          TREBUCHET_ICON: ${{ inputs.icon }}
        run: |
          "$SCRIPTS/tarball.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux_${{ inputs.app }}_${{ matrix.target }}_${{ matrix.arch }}
          path: ${{ env.TREBUCHET_DIST }}/
          if-no-files-found: error

  # Each package as a user gets it: installed in a fresh container of the
  # target's image, with nothing of the build in it.
  smoke:
    name: smoke ${{ matrix.target }} ${{ matrix.arch }}
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TREBUCHET_APP: ${{ inputs.app }}
      TREBUCHET_BINARY: ${{ needs.plan.outputs.binary }}
      TREBUCHET_PACKAGE_VERSION: ${{ needs.plan.outputs.package-version }}
      TREBUCHET_FORMAT: ${{ matrix.format }}
      TREBUCHET_DESKTOP_FILE: ${{ inputs.desktop-file }}
    steps:
      - name: git
        run: |
          if [ "$TREBUCHET_FORMAT" = deb ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git
          else
            dnf -y install ca-certificates git-core tar gzip findutils
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .trebuchet
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux_${{ inputs.app }}_${{ matrix.target }}_${{ matrix.arch }}
          path: .trebuchet-dist
      - name: smoke test
        run: |
          .trebuchet/.github/scripts/linux-packages/smoke.sh .trebuchet-dist

  # Only when every package passed its smoke test.
  release:
    name: attach to the release
    if: inputs.release-tag != ''
    needs: [plan, build, smoke]
    runs-on: ${{ inputs.runner-x64 }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .trebuchet
          persist-credentials: false
      # An app name has no underscore in it, so the pattern takes this app's
      # artifacts and no other's.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux_${{ inputs.app }}_*
          path: .trebuchet-dist
          merge-multiple: true
      - name: attach
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          .trebuchet/.github/scripts/linux-packages/attach.sh "$RELEASE_TAG" .trebuchet-dist/*
