name: linux-packages test
# Calls linux-packages.yml the way an app does, with the fixture app under
# tests/fixture-app, once for each build mode. Every target and architecture
# builds, packages and passes the smoke test. Nothing is attached to a
# release and no secret is used.
#
# Runners: the calls name none, so linux-packages.yml picks them the way it
# does for any caller: Depot's when the repository belongs to Open-Breach,
# GitHub's own for any other owner, and whatever the repository variables
# RUNNER_LINUX_X64 and RUNNER_LINUX_ARM64 say where they are set.
#
# Runs when the workflow, its scripts, the target list or the fixture change,
# and by hand from the Actions tab.
on:
  push:
    paths:
      - .github/workflows/linux-packages.yml
      - .github/workflows/linux-packages-test.yml
      - .github/scripts/linux-packages/**
      - targets.json
      - tests/fixture-app/**
  pull_request:
    paths:
      - .github/workflows/linux-packages.yml
      - .github/workflows/linux-packages-test.yml
      - .github/scripts/linux-packages/**
      - targets.json
      - tests/fixture-app/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-packages-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # A file a job of the caller makes once and every build needs, as an app
  # does with a generated licence list.
  notice:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ vars.RUNNER_LINUX_X64 || (github.repository_owner == 'Open-Breach' && 'depot-ubuntu-24.04-8' || 'ubuntu-24.04') }}
    timeout-minutes: 5
    steps:
      - name: notice
        run: |
          mkdir notice
          echo "made once by the calling workflow" > notice/NOTICE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-notice
          path: notice/
          if-no-files-found: error

  # A cargo build with everything an app can pass: a build command of its
  # own, a file from an earlier job that the build fails without, a bundle
  # with files beside the binary, a desktop entry, icons, dependencies per
  # distro and per target, and a smoke command of its own. The build adds a
  # file to the uploaded folder where its build is also the tarball, and
  # the smoke command looks for it there and nowhere else. Every build also
  # puts a file aside for the smoke test only, and the smoke command looks
  # for it in the test's folder and not among the files for the release.
  # Two plugins are packages of their own, the second with a dependency of
  # its own: the smoke test installs them on top of the main package, and
  # the smoke command finds them in their folders.
  cargo:
    needs: notice
    uses: ./.github/workflows/linux-packages.yml
    with:
      app: trebuchet-fixture
      version: 1.2.3
      working-directory: tests/fixture-app
      build-artifact: fixture-notice
      build-artifact-path: generated
      build-command: ./bundle.sh generated/NOTICE.txt
      smoke-command: ./smoke.sh
      bundle-dir: target/release/bundle
      desktop-file: packaging/trebuchet-fixture.desktop
      icon: packaging/icons/hicolor
      build-deps: |
        {
          "debian": ["zlib1g-dev"],
          "ubuntu": ["zlib1g-dev"],
          "fedora": ["zlib-devel"]
        }
      runtime-deps: |
        {
          "debian": ["bash (>= 4)"],
          "ubuntu-24.04": ["bash (>= 5)"],
          "fedora": ["bash >= 4", "coreutils"]
        }
      plugins-dir: /usr/lib/trebuchet-fixture/plugins
      plugins: |
        [
          { "id": "hello", "summary": "The fixture's first plugin", "files": "target/release/plugins/hello" },
          {
            "id": "extra", "summary": "The fixture's second plugin", "files": "target/release/plugins/extra",
            "runtime-deps": { "debian": ["sed (>= 4)"], "ubuntu-24.04": ["grep"], "fedora": ["sed >= 4"] }
          }
        ]

  # What a release would get: the artifacts gathered by the name the
  # workflow's own release job gathers them by, as does a caller that writes
  # its release itself. The packages, the tarballs and the files the builds
  # added are there; the files for the smoke tests are not.
  gathered:
    needs: cargo
    runs-on: ${{ vars.RUNNER_LINUX_X64 || (github.repository_owner == 'Open-Breach' && 'depot-ubuntu-24.04-8' || 'ubuntu-24.04') }}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux_trebuchet-fixture_*
          path: gathered
          merge-multiple: true
      - name: release files only
        run: |
          ls -l gathered
          for kind in '*.deb' '*.rpm' '*.tar.gz' '*.built-on.txt'; do
            if [ -z "$(find gathered -type f -name "$kind")" ]; then
              echo "::error::no $kind among the gathered artifacts"
              exit 1
            fi
          done
          other="$(find gathered -mindepth 1 ! -name '*.deb' ! -name '*.rpm' ! -name '*.tar.gz' ! -name '*.built-on.txt')"
          if [ -n "$other" ]; then
            echo "::error::not release files, and gathered all the same:"
            echo "$other"
            exit 1
          fi
          echo "only packages, tarballs and the builds' added files"
          # Beside every main package, the two plugin packages and the meta
          # package of the same build: four files per build.
          for kind in deb rpm; do
            main="$(find gathered -name "trebuchet-fixture[_-]1.2.3[_-]*.$kind" | wc -l)"
            for name in trebuchet-fixture-plugin-hello trebuchet-fixture-plugin-extra trebuchet-fixture-plugins; do
              found="$(find gathered -name "${name}[_-]1.2.3[_-]*.$kind" | wc -l)"
              if [ "$main" -eq 0 ] || [ "$found" -ne "$main" ]; then
                echo "::error::$found $kind file(s) of $name for $main of trebuchet-fixture"
                exit 1
              fi
            done
            if [ "$(find gathered -name "*.$kind" | wc -l)" -ne $((main * 4)) ]; then
              echo "::error::more $kind files than the main, the plugin and the meta packages"
              exit 1
            fi
          done
          echo "every build's plugin packages are among them"

  # The folder a prebuilt app brings: here a shell script that prints the
  # version, with a data file beside it. Uploaded as plain files, so it
  # arrives without its executable bit, as any artifact does.
  folder:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ vars.RUNNER_LINUX_X64 || (github.repository_owner == 'Open-Breach' && 'depot-ubuntu-24.04-8' || 'ubuntu-24.04') }}
    timeout-minutes: 5
    steps:
      - name: folder
        run: |
          mkdir -p folder/data
          cat > folder/trebuchet-fixture <<'EOF'
          #!/bin/sh
          echo "trebuchet-fixture 1.2.3-rc1"
          cat "$(dirname "$(readlink -f "$0")")/data/greeting.txt"
          EOF
          echo "prebuilt folder" > folder/data/greeting.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-prebuilt
          path: folder/
          if-no-files-found: error

  # A prebuilt folder with the least an app can pass: no desktop entry, no
  # icon, no smoke command, a binary named differently from the package, a
  # pre-release version, and one target left out.
  prebuilt:
    needs: folder
    uses: ./.github/workflows/linux-packages.yml
    with:
      app: trebuchet-fixture-prebuilt
      binary: trebuchet-fixture
      version: 1.2.3-rc1
      description: Trebuchet test fixture, prebuilt
      build: prebuilt
      artifact: fixture-prebuilt
      exclude: debian-12
